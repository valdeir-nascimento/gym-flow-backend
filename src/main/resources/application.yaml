spring:
  application:
    name: gym-flow-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  modulith:
    republish-outstanding-events-on-restart: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  servlet:
    context-path: /api/v1
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /swagger-ui

logging:
  pattern:
    level: "%5p [%X{requestId:-},%X{customerId:-}]"

rate-limit:
  enabled: true
  rules:
    - paths: ["/auth/login"]
      methods: ["POST"]
      capacity: 10
      refill-tokens: 10
      refill-period: PT1M
    - paths: ["/auth/password-recovery"]
      methods: ["POST"]
      capacity: 5
      refill-tokens: 5
      refill-period: PT5M

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-3232}
    access-ttl: PT15M
    refresh-ttl: P7D
    issuer: ws-fitness
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  invite:
    ttl: PT72H
  password-recovery:
    ttl: PT1H
  login-throttle:
    max-attempts: 5
    window: PT15M
    block-duration: PT15M
  mail:
    from: ${MAIL_FROM:noreply@wsfitness.local}
    sender-name: ${MAIL_SENDER_NAME:WS Fitness}
    base-url: ${APP_BASE_URL:http://localhost:8080}
